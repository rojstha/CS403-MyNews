# Render Blueprint: ONE free web service. Total cost $0.
#
#   Database:        Neon free Postgres (DATABASE_URL, entered in the dashboard)
#   Hourly collect:  cron-job.org calls POST /admin/collect at minute 0 (free)
#   Keep awake:      cron-job.org calls GET /health every 10 minutes (free)
#   AI summaries:    Ollama on the developer's Mac (python -m app.ai_worker, launchd)
#
# Secrets marked `sync: false` are typed into the Render dashboard, never committed.
# See docs/DEPLOY.md.

services:
  - type: web
    name: mynews-api
    runtime: python
    rootDir: backend
    plan: free            # 512 MB, 750 free instance hours per month; no payment method needed
    region: ohio          # close to Neon's AWS US East 2 (Ohio) region
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL         # Neon connection string (contains the DB password)
        sync: false
      - key: ADMIN_TOKEN          # protects POST /admin/collect; random value made by Render
        generateValue: true
      - key: CONTACT_INFO         # Wikipedia requires a URL or email in the User-Agent
        sync: false
      # The cloud server never runs AI; the Mac's AI worker writes summaries.
      - key: AI_PROVIDER
        value: none
      - key: AI_MIN_PUBLISHERS    # must match the Mac's AI worker setting
        value: "2"
      - key: RETENTION_HOURS
        value: "168"
